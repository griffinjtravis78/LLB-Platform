<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLB Platform | Life, Legacy, and Bereavement ERP</title>
    <base href="/LLB-Platform/">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        charcoal: {
                            DEFAULT: '#0E0E0E',
                            card: '#161616',
                            muted: '#1F2937',
                        },
                        gold: {
                            DEFAULT: '#C5A059',
                            accent: '#D4AF37',
                            dark: '#9A7B38',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-charcoal text-white">
    <!-- Header with Logo Integration -->
    <header class="bg-charcoal-card border-b border-gold/20 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <img src="./LLB.jpeg" alt="LLB Life Legacy Bereavement Logo" class="h-10 w-auto object-contain rounded border border-gold/30">
            <span class="text-gold font-bold text-lg tracking-wider">LLB Platform</span>
        </div>
        <div class="text-xs text-gray-400">Enterprise Estate ERP</div>
    </header>

    <div id="app"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
