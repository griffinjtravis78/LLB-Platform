<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLB Platform | Life, Legacy, and Bereavement ERP</title>
    <base href="/LLB-Platform/">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        charcoal: {
                            DEFAULT: '#0E0E0E',
                            card: '#161616',
                            muted: '#1F2937',
                        },
                        gold: {
                            DEFAULT: '#C5A059',
                            accent: '#D4AF37',
                            dark: '#9A7B38',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body style="background-color: #0E0E0E; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh;">
    <!-- Header with Exact Brand Styling -->
    <header style="background-color: #161616; border-bottom: 1px solid rgba(197, 160, 89, 0.2); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="./LLB.jpeg" alt="LLB Logo" style="height: 2.5rem; width: auto; object-fit: contain; border-radius: 0.25rem; border: 1px solid rgba(197, 160, 89, 0.3);">
            <span style="color: #C5A059; font-weight: bold; font-size: 1.125rem; letter-spacing: 0.05em;">LLB Platform</span>
        </div>
        <div style="font-size: 0.75rem; color: #9CA3AF;">Enterprise Estate ERP</div>
    </header>

    <!-- Main Container -->
    <div id="app" style="padding: 2rem;"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
