<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLB Platform | Life, Legacy, and Bereavement ERP</title>
    <base href="/LLB-Platform/">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        charcoal: {
                            DEFAULT: '#2C353D',
                            card: '#485664',
                            muted: '#6A7B8C',
                        },
                        gold: {
                            DEFAULT: '#D8C3A5',
                            accent: '#A38E70',
                            dark: '#8C7757',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body style="background-color: #2C353D; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh;">
    <!-- Header with Exact Brand Styling -->
    <header style="background-color: #485664; border-bottom: 1px solid rgba(216, 195, 165, 0.3); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="./LLB.jpeg" alt="LLB Logo" style="height: 3rem; width: auto; object-fit: contain; border-radius: 0.375rem; border: 1px solid rgba(216, 195, 165, 0.4); background: #FFFFFF; padding: 2px;">
            <span style="color: #D8C3A5; font-weight: bold; font-size: 1.25rem; letter-spacing: 0.05em;">LLB Platform</span>
        </div>
        <div style="font-size: 0.75rem; color: #CBD5E1; font-family: monospace;">Enterprise Estate ERP</div>
    </header>

    <!-- Main Container -->
    <div id="app" style="padding: 2rem;"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
